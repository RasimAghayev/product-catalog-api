# Isolated project name so parallel agents on other repos never collide on
# container/network names (R4). Ports come from the block reserved for this
# repo in projects/info/state/ports.md (20110-20119) - override via APP_PORT
# if that port is busy on the host. "task-brief-company" was this repo's
# pre-rename identity (see composer.json's own package name for the same
# leftover) and is replaced here with the real repo name.
name: product-catalog-api-p5

# Every bind mount of the stack lives under var/ (R92): the local environment
# file and the database state. The application source is baked into the image,
# so no versioned directory is mounted into a container. Named volumes are
# forbidden.
#
# Resource limits are required for every service (R60, R64, R102).
x-resources-default: &resources-default
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M
        pids: 256
      reservations:
        cpus: "0.25"
        memory: 128M

services:
  app:
    build:
      context: .
      dockerfile: build/php/Dockerfile
      target: runtime
    container_name: product_catalog_api_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - var/.env
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      # The credentials of the database are never given a default value: a
      # default password is a password that everybody knows, and the scanner
      # of the repository reads it as a committed secret.
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required, copy .env.example to var/.env}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required, copy .env.example to var/.env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, copy .env.example to var/.env}
    ports:
      # Reserved block for this repo: 20110-20119 (projects/info/state/ports.md).
      - "${APP_PORT:-20110}:8080"
    <<: *resources-default
    networks:
      - product-catalog-api

  test:
    build:
      context: .
      dockerfile: build/php/Dockerfile
      target: test
    profiles: ["test"]
    # The suite runs against an in memory database, so it needs neither a
    # database nor the network. It reads no environment file, so the values
    # of the local machine cannot change the result.
    <<: *resources-default
    networks:
      - product-catalog-api

  postgres:
    build:
      context: .
      dockerfile: build/postgres/Dockerfile
    container_name: product_catalog_api_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required, copy .env.example to var/.env}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required, copy .env.example to var/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, copy .env.example to var/.env}
      POSTGRES_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required, copy .env.example to var/.env}
      # Postgres 18's image moved its default PGDATA to a major-version-
      # specific subdirectory of /var/lib/postgresql (docker-library/postgres
      # #1259, for pg_upgrade --link support). This repo's bind mount points
      # straight at .../data with no existing on-disk database to migrate, so
      # the upstream-documented backward-compatible override is used instead
      # of restructuring the mount: same path as every prior major, nothing
      # else in the stack has to change.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./var/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:?DB_USERNAME is required} -d ${DB_DATABASE:?DB_DATABASE is required}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    <<: *resources-default
    networks:
      - product-catalog-api

networks:
  product-catalog-api:
    name: product-catalog-api-p5
